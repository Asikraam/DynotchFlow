name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $files = @("main.js", "preload.js", "services.js", "renderer/app.js", "scripts/build-bridge.js")
          foreach ($f in $files) {
            Write-Host "Checking $f..."
            node --check $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Compile C# WinRT Bridge, Launcher & Setup Stub
        shell: pwsh
        run: |
          npm run build:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build | Format-Table Name, Length -AutoSize

      - name: Security & Electron dependency dry-run
        shell: pwsh
        run: |
          npm install --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compiled native binaries
        uses: actions/upload-artifact@v4
        with:
          name: dynotchflow-win-x64-binaries
          path: build/*.exe
          if-no-files-found: error
