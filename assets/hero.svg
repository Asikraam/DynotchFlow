<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="50%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.22" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.78" cy="0.65" r="0.45">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="notchBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11131a"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="albumArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="waveLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="920" height="340" rx="20" fill="url(#bg)"/>
  <rect width="920" height="340" rx="20" fill="url(#glowL)"/>
  <rect width="920" height="340" rx="20" fill="url(#glowR)"/>
  <rect x="0.5" y="0.5" width="919" height="339" rx="19.5" stroke="#1e293b" stroke-opacity="0.8"/>

  <!-- Subtle top bezel line -->
  <line x1="60" y1="22" x2="860" y2="22" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Top Center Collapsed Dynamic Island Pill Preview -->
  <rect x="330" y="22" width="260" height="36" rx="18" fill="#08090d" stroke="#263042" stroke-width="1"/>
  <rect x="342" y="29" width="22" height="22" rx="6" fill="url(#albumArt)"/>
  <circle cx="353" cy="40" r="4" fill="#08090d" fill-opacity="0.65"/>
  <text x="374" y="44" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">Synced Karaoke Lyric...</text>
  <rect x="556" y="34" width="3" height="12" rx="1.5" fill="#38bdf8"/>
  <rect x="562" y="31" width="3" height="18" rx="1.5" fill="#60a5fa"/>
  <rect x="568" y="35" width="3" height="10" rx="1.5" fill="#818cf8"/>
  <rect x="574" y="33" width="3" height="14" rx="1.5" fill="#a855f7"/>

  <!-- Expanded Island Card Centerpiece -->
  <g transform="translate(215, 76)">
    <rect x="0" y="0" width="490" height="176" rx="24" fill="url(#notchBg)" stroke="#273248" stroke-width="1.2"/>
    <!-- Tabs bar -->
    <text x="24" y="27" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Music</text>
    <rect x="24" y="33" width="31" height="2" rx="1" fill="#38bdf8"/>
    <text x="74" y="27" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Calendar</text>
    <text x="138" y="27" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Weather &amp; Prayer</text>
    <text x="248" y="27" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Shelf</text>
    <text x="294" y="27" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Setting</text>

    <!-- Volume badge + Hide top icon -->
    <rect x="398" y="13" width="48" height="20" rx="10" fill="#171b26" stroke="#283246"/>
    <text x="411" y="27" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10">42%</text>
    <circle cx="464" cy="23" r="10" fill="#171b26" stroke="#283246"/>
    <path d="M464 27V19M460.5 22L464 18.5L467.5 22" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left music card -->
    <rect x="22" y="50" width="58" height="58" rx="12" fill="url(#albumArt)"/>
    <circle cx="51" cy="79" r="9" fill="#08090d" fill-opacity="0.55"/>
    <text x="92" y="70" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Midnight City</text>
    <text x="92" y="88" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">M83 · WinRT GSMTC</text>
    <rect x="92" y="96" width="52" height="15" rx="4" fill="#172554"/>
    <text x="99" y="107" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">SPOTIFY</text>

    <!-- 60fps Wavy Scrubber -->
    <path d="M22 126 Q 32 120, 42 126 T 62 126 T 82 126 T 102 126 T 122 126 T 142 126" stroke="url(#waveLine)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="142" cy="126" r="4.5" fill="#ffffff"/>
    <line x1="146" y1="126" x2="220" y2="126" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Playback controls -->
    <path d="M98 147L90 152L98 157V147Z" fill="#94a3b8"/>
    <circle cx="122" cy="152" r="13" fill="#ffffff"/>
    <rect x="118" y="147" width="3" height="10" rx="1" fill="#08090d"/>
    <rect x="123" y="147" width="3" height="10" rx="1" fill="#08090d"/>
    <path d="M146 147L154 152L146 157V147Z" fill="#94a3b8"/>

    <!-- Vertical divider -->
    <line x1="242" y1="50" x2="242" y2="160" stroke="#1e293b"/>

    <!-- Right side live synced lyrics -->
    <text x="262" y="72" fill="#475569" font-family="Segoe UI, sans-serif" font-size="11.5">Waiting in a car</text>
    <text x="262" y="96" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Waiting for a ride in the dark</text>
    <text x="262" y="120" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11.5">The night city grows</text>
    <text x="262" y="144" fill="#475569" font-family="Segoe UI, sans-serif" font-size="11.5">Look and see her eyes, they glow</text>
  </g>

  <!-- Floating Widget Pills left & right -->
  <g transform="translate(32, 118)">
    <rect width="156" height="86" rx="16" fill="#0d111a" stroke="#1e293b"/>
    <text x="16" y="26" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">WEATHER &amp; PRAYER</text>
    <text x="16" y="51" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">27°C</text>
    <text x="72" y="49" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">BMKG · Partly</text>
    <text x="16" y="71" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Maghrib in 24m</text>
  </g>

  <g transform="translate(732, 118)">
    <rect width="156" height="86" rx="16" fill="#0d111a" stroke="#1e293b"/>
    <text x="16" y="26" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">CALENDAR &amp; SHELF</text>
    <rect x="16" y="38" width="38" height="15" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="22" y="49" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700">LIVE</text>
    <text x="60" y="49" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Team Sync</text>
    <text x="16" y="71" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10.5">Drag &amp; Drop Shelf</text>
  </g>

  <!-- Footer Title & Metrics -->
  <text x="460" y="294" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">DynotchFlow V4</text>
  <text x="460" y="318" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">Ultra-Lightweight Dynamic Island for Windows 11 · Electron + Native C# WinRT Bridge (~53 MB RAM · 0% Idle CPU)</text>
</svg>
